{% extends "base.html" %}
{% block title %}{{ info_title }} · {{ stock_code }} - QuantDesk{% endblock %}
{% block content %}
<div class="container">
    <div class="page-title">
        <a href="/stock_kline/{{ stock_code }}" style="color:#1e88e5;text-decoration:none;font-size:17px">← 返回个股页</a>
        &nbsp;·&nbsp; {{ info_title }}（{{ stock_code }}）
    </div>

    <div class="card">
        <div id="infoBody"><div class="loading">数据加载中...</div></div>
        <div class="tip" id="infoMeta"></div>
    </div>
</div>

<script>
const STOCK_CODE = '{{ stock_code }}';
const KIND = '{{ kind }}';

function fv(v, nd = 2) { return (v === null || v === undefined) ? '--' : v.toFixed(nd); }
function fmtDate(s) { return s && s.length === 8 ? `${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6,8)}` : (s || '--'); }
function changeCell(v) {
    if (v === null || v === undefined || v === 0) return '<span style="color:#90a4ae">不变</span>';
    return v > 0 ? `<span class="rise">+${v}</span>` : `<span class="fall">${v}</span>`;
}

/* 通用表格 */
function tbl(head, rows) {
    if (!rows || !rows.length) return '<div class="tip">暂无数据</div>';
    return `<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:15px">
        <thead><tr>${head.map(h => `<th style="text-align:${h[1] || 'left'};padding:9px 10px;color:#90a4ae;font-weight:normal;border-bottom:2px solid #eceff1;white-space:nowrap">${h[0]}</th>`).join('')}</tr></thead>
        <tbody>${rows.map(r => `<tr>${r.map((c, i) =>
            `<td style="padding:8px 10px;border-bottom:1px solid #f5f5f5;text-align:${i > 0 ? 'right' : 'left'};white-space:nowrap">${c}</td>`).join('')}</tr>`).join('')}
        </tbody></table></div>`;
}

/* 公告/年报：链接列表（点击在线查看真实原文） */
function linkList(rows) {
    if (!rows || !rows.length) return '<div class="tip">暂无数据</div>';
    return rows.map(r => `
        <div style="padding:11px 2px;border-bottom:1px dashed #eceff1;display:flex;gap:14px;align-items:baseline">
            <span style="color:#90a4ae;font-size:14px;white-space:nowrap">${(r.date || '').slice(0, 10)}</span>
            <a href="${r.url}" target="_blank" style="color:#1e2a3a;text-decoration:none;flex:1;font-size:16px"
               onmouseover="this.style.color='#1e88e5'" onmouseout="this.style.color='#1e2a3a'">${r.title}</a>
            <a href="${r.url}" target="_blank" style="color:#1e88e5;font-size:14px;white-space:nowrap;text-decoration:none">查看原文 →</a>
        </div>`).join('');
}

const RENDER = {
    top10_holders(d) {
        $('#infoMeta').text(`报告期 ${fmtDate(d.end_date)} · 公告日 ${fmtDate(d.ann_date)} · Tushare top10_holders`);
        return tbl([['股东名称'], ['持股数量(万股)', 'right'], ['持股比例%', 'right'], ['占流通股%', 'right'], ['变动(万股)', 'right'], ['股东类型', 'right']],
            d.holders.map(h => [h.name, fv(h.amount), fv(h.ratio), fv(h.float_ratio), changeCell(h.change), h.type || '--']));
    },
    top10_float(d) {
        $('#infoMeta').text(`报告期 ${fmtDate(d.end_date)} · 公告日 ${fmtDate(d.ann_date)} · Tushare top10_floatholders`);
        return tbl([['股东名称'], ['持股数量(万股)', 'right'], ['持股比例%', 'right'], ['占流通股%', 'right'], ['变动(万股)', 'right'], ['股东类型', 'right']],
            d.holders.map(h => [h.name, fv(h.amount), fv(h.ratio), fv(h.float_ratio), changeCell(h.change), h.type || '--']));
    },
    fund_holdings(d) {
        if (!d.found) {
            $('#infoMeta').text('数据来源：东方财富数据中心（Tushare 当前接口版本不含基金持股，采用同源替代）');
            return '<div class="tip">最近报告期暂无基金持仓该股的公开记录</div>';
        }
        $('#infoMeta').text(`报告期 ${d.report_date} · 数据来源：东方财富数据中心-基金持仓`);
        return tbl([['持有基金家数', 'right'], ['持股总数(万股)', 'right'], ['持股市值(亿元)', 'right'],
                    ['占总股本%', 'right'], ['占流通股%', 'right'], ['持股变化', 'right'], ['变动(万股)', 'right']],
            d.rows.map(r => [r.fund_count, fv(r.shares_wan, 1), fv(r.value_yi), fv(r.total_ratio), fv(r.free_ratio),
                r.cha === '增仓' ? '<span class="rise">增仓</span>' : r.cha === '减仓' ? '<span class="fall">减仓</span>' : (r.cha || '--'),
                r.cha_wan != null ? changeCell(r.cha_wan) : '--']));
    },
    /* 资金流向（新浪，近10日） */
    fund_flow(rows) {
        $('#infoMeta').text('数据来源：新浪财经-资金流向 · 单位：万元 · 主力=超大单+大单（Tushare moneyflow 需2000积分，采用同源替代）');
        const w = v => v == null ? '--' : `<span class="${v >= 0 ? 'rise' : 'fall'}">${v >= 0 ? '+' : ''}${v.toFixed(1)}</span>`;
        return tbl([['日期'], ['收盘', 'right'], ['涨跌幅', 'right'], ['主力净额', 'right'], ['超大单', 'right'],
                    ['大单', 'right'], ['中单', 'right'], ['小单', 'right'], ['净流入率', 'right']],
            rows.map(r => [r.date, fv(r.close), r.pct != null ? `<span class="${r.pct >= 0 ? 'rise' : 'fall'}">${r.pct >= 0 ? '+' : ''}${r.pct}%</span>` : '--',
                w(r.main_wan), w(r.xl_wan), w(r.l_wan), w(r.m_wan), w(r.s_wan),
                r.ratio != null ? `<span class="${r.ratio >= 0 ? 'rise' : 'fall'}">${r.ratio}%</span>` : '--']));
    },
    /* 个股相关新闻 */
    news(rows) {
        $('#infoMeta').text('数据来源：东方财富搜索 · 与该股票相关的最新新闻');
        if (!rows || !rows.length) return '<div class="tip">暂无相关新闻</div>';
        return rows.map(r => `
            <div style="padding:10px 2px;border-bottom:1px dashed #eceff1">
                <div style="display:flex;gap:12px;align-items:baseline">
                    <span style="color:#90a4ae;font-size:13px;white-space:nowrap">${(r.time || '').slice(5, 16)}</span>
                    <a href="${r.url}" target="_blank" style="color:#1e2a3a;text-decoration:none;flex:1;font-weight:600"
                       onmouseover="this.style.color='#1e88e5'" onmouseout="this.style.color='#1e2a3a'">${r.title}</a>
                    <span style="color:#90a4ae;font-size:13px;white-space:nowrap">${r.source}</span>
                </div>
                <div style="color:#78909c;font-size:14px;margin-top:3px;padding-left:64px">${r.content}……</div>
            </div>`).join('');
    },
    holder_number(rows) {
        $('#infoMeta').text('Tushare stk_holdernumber · 按报告期倒序');
        return tbl([['报告期'], ['股东户数', 'right']],
            rows.map(r => [fmtDate(r.end_date), r.num.toLocaleString()]));
    },
    holder_trade(rows) {
        $('#infoMeta').text('Tushare stk_holdertrade · 增持红 / 减持绿');
        return tbl([['公告日期'], ['股东'], ['方向', 'right'], ['变动(万股)', 'right'], ['占流通股%', 'right'], ['成交均价', 'right']],
            rows.map(r => [fmtDate(r.ann_date), r.holder,
                r.in_de === '增持' ? '<span class="rise">增持</span>' : r.in_de === '减持' ? '<span class="fall">减持</span>' : r.in_de,
                fv(r.vol), fv(r.ratio), fv(r.price)]));
    },
    dividend(rows) {
        $('#infoMeta').text('Tushare dividend · 每10股口径');
        return tbl([['报告期'], ['进度', 'right'], ['派息(元,含税)', 'right'], ['送转(股)', 'right'], ['除权除息日', 'right']],
            rows.map(r => [fmtDate(r.end_date), r.proc,
                r.cash != null ? r.cash.toFixed(3) : '--',
                r.stock != null ? r.stock.toFixed(3) : '--',
                r.ex_date ? fmtDate(r.ex_date) : '--']));
    },
    managers(rows) {
        $('#infoMeta').text('Tushare stk_managers · 在任高管');
        return tbl([['姓名'], ['职务', 'right'], ['性别', 'right'], ['学历', 'right'], ['任职日期', 'right']],
            rows.map(r => [r.name, r.title || '--', r.gender || '--', r.edu || '--', fmtDate(r.begin_date)]));
    },
    annual_reports(rows) {
        $('#infoMeta').text('数据来源：巨潮资讯网 · 点击「查看原文」在线阅读真实年报（内嵌 PDF）');
        return linkList(rows);
    },
    announcements(rows) {
        $('#infoMeta').text('数据来源：巨潮资讯网 · 近 120 天公告');
        return linkList(rows);
    },
};

$.getJSON(`/api/market/stock_info?code=${STOCK_CODE}&kind=${KIND}`).done(function(res) {
    if (res.code !== 0) { $('#infoBody').html(`<div class="tip">${res.msg}</div>`); return; }
    $('#infoBody').html(RENDER[KIND] ? RENDER[KIND](res.data) : '<div class="tip">暂无数据</div>');
}).fail(function() {
    $('#infoBody').html('<div class="tip">加载失败，请刷新重试</div>');
});
</script>
{% endblock %}
