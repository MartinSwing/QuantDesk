{% extends "base.html" %}
{% block title %}登录 - QuantDesk{% endblock %}
{% block content %}
<div class="auth-box">
    <h2>📈 QuantDesk 登录</h2>
    <form method="post" action="/login">
        <div class="form-group">
            <label>账号</label>
            <input type="text" name="user_account" required placeholder="请输入系统分配的账号">
        </div>
        <div class="form-group">
            <label>密码</label>
            <input type="password" name="password" required placeholder="请输入密码">
        </div>
        <div class="form-actions"><button class="btn" type="submit">登 录</button></div>
    </form>
    <div class="auth-links">
        <a href="/register">注册新账号</a> &nbsp;|&nbsp;
        <a href="/forget_pwd">忘记密码</a>
    </div>
</div>
{% endblock %}
