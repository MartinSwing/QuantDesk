{% extends "base.html" %}
{% block title %}找回密码 - QuantDesk{% endblock %}
{% block content %}
<div class="auth-box">
    <h2>找回密码</h2>
    {% if step == '1' %}
    <form method="post" action="/forget_pwd">
        <input type="hidden" name="step" value="1">
        <div class="form-group"><label>真实姓名</label><input type="text" name="real_name" required></div>
        <div class="form-group"><label>身份证号</label><input type="text" name="id_card" maxlength="18" required></div>
        <div class="form-group"><label>手机号</label><input type="text" name="phone" maxlength="11" required></div>
        <div class="form-actions"><button class="btn" type="submit">验证身份</button></div>
    </form>
    {% else %}
    <form method="post" action="/forget_pwd">
        <input type="hidden" name="step" value="2">
        <input type="hidden" name="user_account" value="{{ user_account }}">
        <p style="color:#607d8b;margin-bottom:14px">账号：<b>{{ user_account }}</b></p>
        <div class="form-group"><label>新密码（至少6位）</label><input type="password" name="new_password" required></div>
        <div class="form-group"><label>确认新密码</label><input type="password" name="confirm_password" required></div>
        <div class="form-actions"><button class="btn" type="submit">重置密码</button></div>
    </form>
    {% endif %}
    <div class="auth-links"><a href="/login">返回登录</a></div>
</div>
{% endblock %}
