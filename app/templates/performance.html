{% extends "base.html" %}
{% block title %}收益曲线 - QuantDesk{% endblock %}
{% block content %}
<div class="container">
    <div class="page-title">收益曲线 · 账户净值 vs 沪深300</div>

    <div id="summaryCards" style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:18px">
        <div class="card" style="flex:1;min-width:150px"><div class="loading">计算中...</div></div>
    </div>

    <div class="card">
        <h3>累计收益率对比 <span class="tip" style="display:inline" id="benchTip"></span></h3>
        <div id="curveChart" style="height:440px"></div>
        <div class="tip">口径说明：账户净值 = 累计现金 + 持仓市值（按日收盘价估值）；出入金已计入现金流，不影响收益率口径；沪深300与账户收益率均以区间首日为基准归一化。</div>
    </div>
</div>

<script>
let curveChart = null;
const fmtPct = v => (v == null ? '--' : (v >= 0 ? '+' : '') + v.toFixed(2) + '%');

function loadCurve() {
    $.getJSON('/api/asset/equity_curve').done(function(res) {
        if (res.code !== 0 || !res.data.points || res.data.points.length === 0) {
            $('#summaryCards').html('<div class="card" style="flex:1"><div class="empty-tip">暂无资金流水或交易数据，先去「我的资产」入金或交易一笔吧</div></div>');
            return;
        }
        const s = res.data.summary;
        const cls = v => v >= 0 ? 'rise' : 'fall';
        $('#summaryCards').html([
            {label: '最新总资产', val: `¥${s.latest_asset.toLocaleString('zh-CN', {minimumFractionDigits: 2})}`, cls: ''},
            {label: '累计收益率', val: fmtPct(s.return_pct), cls: cls(s.return_pct)},
            {label: '沪深300 同期', val: fmtPct(s.benchmark_pct), cls: cls(s.benchmark_pct)},
            {label: '超额收益', val: s.excess_pct == null ? '--' : fmtPct(s.excess_pct), cls: s.excess_pct == null ? '' : cls(s.excess_pct)},
            {label: '最大回撤', val: (s.max_drawdown_pct == null ? '--' : s.max_drawdown_pct.toFixed(2) + '%'), cls: 'fall'},
            {label: '统计区间', val: `${s.start_date} ~ ${s.end_date}`, cls: '', small: true},
        ].map(c => `<div class="card" style="flex:1;min-width:150px">
            <div style="color:#78909c">${c.label}</div>
            <div style="font-weight:bold;margin-top:6px;${c.small ? 'font-size:15px' : 'font-size:22px'}" class="${c.cls}">${c.val}</div>
        </div>`).join(''));

        if (res.data.benchmark) {
            $('#benchTip').text(`（基准：${res.data.benchmark}）`);
        } else {
            $('#benchTip').text('（基准数据暂缺，仅展示账户收益率）');
        }

        const dates = res.data.points.map(p => p.date);
        const myRet = res.data.points.map(p => p.return_pct);
        const benchRet = res.data.points.map(p => p.benchmark_pct);
        const assets = res.data.points.map(p => p.asset);

        curveChart = curveChart || echarts.init($('#curveChart')[0]);
        curveChart.setOption({
            tooltip: {
                trigger: 'axis',
                formatter: function(params) {
                    const i = params[0].dataIndex;
                    let html = `${dates[i]}<br/>总资产：¥${Number(assets[i]).toLocaleString('zh-CN')}`;
                    params.forEach(p => {
                        html += `<br/>${p.marker}${p.seriesName}：${fmtPct(p.value)}`;
                    });
                    return html;
                }
            },
            legend: {top: 2},
            grid: {left: 60, right: 30, top: 40, bottom: 60},
            xAxis: {type: 'category', data: dates},
            yAxis: {type: 'value', axisLabel: {formatter: '{value}%'}},
            dataZoom: [{type: 'inside'}, {type: 'slider', height: 20, bottom: 8}],
            series: [
                {name: '我的账户', type: 'line', data: myRet, showSymbol: false,
                 lineStyle: {width: 2.5, color: '#e53935'}, itemStyle: {color: '#e53935'},
                 areaStyle: {opacity: 0.06}},
                {name: '沪深300', type: 'line', data: benchRet, showSymbol: false,
                 lineStyle: {width: 1.8, type: 'dashed', color: '#1e88e5'}, itemStyle: {color: '#1e88e5'}},
            ]
        }, true);
    }).fail(function() {
        $('#summaryCards').html('<div class="card" style="flex:1"><div class="empty-tip">收益曲线加载失败，请刷新重试</div></div>');
    });
}

$(function() { loadCurve(); $(window).on('resize', () => curveChart && curveChart.resize()); });
</script>
{% endblock %}
